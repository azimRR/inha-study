<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CA Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  .bar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--sheet); border-bottom: 1.5px solid var(--line);
  }
  .bar .deck-name { font: 700 15px/1.2 var(--display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar a.home { font-weight: 700; text-decoration: none; white-space: nowrap; }
  .iconbtn {
    font: 600 14px/1 var(--body); padding: 8px 11px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); white-space: nowrap;
  }
  .iconbtn:hover { border-color: var(--blue); color: var(--blue); }
  .stage { overflow-y: auto; padding: 24px 16px; display: flex; justify-content: center; }
  .slide {
    width: min(1100px, 100%); margin: auto 0; background: var(--sheet); border: 1.5px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); padding: clamp(20px, 4vw, 48px);
    display: grid; gap: 18px; align-content: start; min-height: min(620px, 100%);
    position: relative; animation: in .25s ease-out;
  }
  @keyframes in { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
  .slide .num { font: 700 13px/1 var(--mono); color: var(--muted); }
  .slide h2 { font-size: clamp(26px, 3.4vw, 40px); }
  .slide h2::after { content: ""; display: block; width: 56px; height: 4px; background: var(--blue); border-radius: 2px; margin-top: 12px; }
  .slide h3 { font-size: 18px; margin-bottom: 6px; }
  .slide p { margin: 0; }
  .foot {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--sheet); border-top: 1.5px solid var(--line);
  }
  .progress { flex: 1; height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--blue); transition: width .2s; }
  .count { font: 700 14px var(--mono); font-variant-numeric: tabular-nums; min-width: 60px; text-align: center; }
  .nav { font-size: 18px; padding: 8px 16px; }
  .overview {
    position: fixed; inset: 0; background: var(--paper); z-index: 10; overflow-y: auto; padding: 24px 16px;
  }
  .overview .grid { max-width: 1100px; margin: 0 auto; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .overview button {
    text-align: left; font: 600 15px/1.3 var(--body); color: var(--ink); cursor: pointer;
    background: var(--sheet); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px;
  }
  .overview button span { display: block; font: 700 12px var(--mono); color: var(--muted); margin-bottom: 6px; }
  .overview button.cur, .overview button:hover { border-color: var(--blue); }
  .overview .top { max-width: 1100px; margin: 0 auto 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .checklist { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; font-size: .92em; }
  .check input { margin-top: 4px; accent-color: var(--green); width: 17px; height: 17px; flex: none; }
  .check:has(input:checked) { border-color: var(--green); background: var(--green-soft); }
  .check-count { font-weight: 700; color: var(--green); margin-top: 8px !important; }
  .hint { font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) {
    .hide-sm { display: none; }
    body { font-size: 16px; }
  }
</style>
</head>
<body>
  <header class="bar">
    <a class="home" href="index.html">← All decks</a>
    <div class="deck-name" id="deckName"></div>
    <button class="iconbtn" id="ovBtn" title="All slides in this deck (O)">Slides list</button>
    <button class="iconbtn hide-sm" id="fsBtn" title="Fullscreen (F)">Fullscreen</button>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="foot">
    <button class="iconbtn nav" id="prev" aria-label="Previous slide">←</button>
    <div class="progress"><div id="prog"></div></div>
    <div class="count" id="count"></div>
    <button class="iconbtn nav" id="next" aria-label="Next slide">→</button>
    <span class="hint hide-sm">keys: ← → · O list · F fullscreen</span>
  </footer>
  <div class="overview" id="overview" hidden></div>

<script src="decks.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const hash = location.hash.slice(1).split("-");
  const deckId = params.get("d") || hash[0] || "plan";
  const deck = DECKS.find((d) => d.id === deckId) || DECKS[0];
  let idx = Math.max(0, Math.min(deck.slides.length - 1, (parseInt(hash[1], 10) || 1) - 1));

  document.title = `${deck.title} · CA Slides`;
  document.getElementById("deckName").textContent = `${deck.n} · ${deck.title}`;
  const stage = document.getElementById("stage");

  function show(i) {
    idx = Math.max(0, Math.min(deck.slides.length - 1, i));
    const s = deck.slides[idx];
    stage.innerHTML = `<article class="slide"><div class="num">${deck.week.toUpperCase()} · ${idx + 1} / ${deck.slides.length}</div><h2>${s.t}</h2>${s.h}</article>`;
    stage.scrollTop = 0;
    renderChecklist(document.getElementById("checklist"));
    document.getElementById("count").textContent = `${idx + 1}/${deck.slides.length}`;
    document.getElementById("prog").style.width = `${((idx + 1) / deck.slides.length) * 100}%`;
    document.getElementById("prev").disabled = idx === 0;
    history.replaceState(null, "", `#${deck.id}-${idx + 1}`);
  }

  function nextDeckLink() {
    const k = DECKS.indexOf(deck);
    return DECKS[k + 1];
  }

  document.getElementById("prev").onclick = () => show(idx - 1);
  document.getElementById("next").onclick = () => {
    if (idx < deck.slides.length - 1) return show(idx + 1);
    const nd = nextDeckLink();
    if (nd) { location.hash = `${nd.id}-1`; location.reload(); }
  };
  window.addEventListener("hashchange", () => {
    const [d, n] = location.hash.slice(1).split("-");
    if (d !== deck.id) location.reload();
    else if (n && +n - 1 !== idx) show(+n - 1);
  });

  const ov = document.getElementById("overview");
  function openOverview() {
    ov.innerHTML = `<div class="top"><h2>${deck.title}</h2><button class="iconbtn" id="ovClose">Close ✕</button></div><div class="grid">` +
      deck.slides.map((s, i) => `<button data-i="${i}" class="${i === idx ? "cur" : ""}"><span>${i + 1}</span>${s.t}</button>`).join("") + `</div>`;
    ov.hidden = false;
    ov.querySelector("#ovClose").onclick = () => (ov.hidden = true);
    ov.querySelectorAll("button[data-i]").forEach((b) => (b.onclick = () => { ov.hidden = true; show(+b.dataset.i); }));
  }
  document.getElementById("ovBtn").onclick = openOverview;

  function toggleFs() {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  }
  document.getElementById("fsBtn").onclick = toggleFs;

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, summary")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); document.getElementById("next").click(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(idx - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(deck.slides.length - 1);
    else if (e.key.toLowerCase() === "o") ov.hidden ? openOverview() : (ov.hidden = true);
    else if (e.key.toLowerCase() === "f") toggleFs();
    else if (e.key === "Escape") ov.hidden = true;
  });

  let tx = null, ty = null;
  stage.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? document.getElementById("next").click() : show(idx - 1);
    tx = null;
  });

  show(idx);
</script>
</body>
</html>
