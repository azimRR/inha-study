<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Econ Midterm Slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  :root { --blue: #0e7a68; --blue-soft: #dff3ee; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --blue: #4fd1b8; --blue-soft: #133a33; } }
  :root[data-theme="dark"] { --blue: #4fd1b8; --blue-soft: #133a33; }
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  .bar, .foot { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--sheet); }
  .bar { border-bottom: 1.5px solid var(--line); flex-wrap: wrap; }
  .foot { border-top: 1.5px solid var(--line); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .bar a.home { font-weight: 700; text-decoration: none; white-space: nowrap; }
  .title { font: 700 15px/1.2 var(--display); flex: 1; min-width: 140px; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { font: 700 14px/1 var(--body); padding: 9px 12px; border: 0; background: var(--sheet); color: var(--ink-soft); cursor: pointer; }
  .seg button.on { background: var(--blue); color: var(--sheet); }
  .iconbtn { font: 600 14px/1 var(--body); padding: 8px 11px; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); white-space: nowrap; }
  .iconbtn:hover { border-color: var(--blue); color: var(--blue); }
  .stage { overflow-y: auto; padding: 20px 16px; }
  .card { max-width: 1280px; margin: 0 auto; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: clamp(16px, 3vw, 36px); display: grid; gap: 16px; animation: in .2s ease-out; }
  @keyframes in { from { opacity: .6; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .kicker { font: 700 13px/1 var(--mono); color: var(--muted); letter-spacing: .04em; }
  .card h2 { font-size: clamp(24px, 3vw, 36px); }
  .split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .imgs { display: grid; gap: 12px; position: sticky; top: 0; }
  .imgs a { display: block; }
  .imgs img, .solo img { width: 100%; display: block; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
  .imgs a:hover img, .solo a:hover img { border-color: var(--blue); }
  .solo img { width: auto; max-width: 100%; max-height: calc(100vh - 190px); margin: 0 auto; object-fit: contain; }
  .imgs span { display: block; font: 700 12px var(--mono); color: var(--muted); margin-top: 4px; }
  .text { display: grid; gap: 14px; }
  .qbox { border-color: var(--ink); }
  .qbox::before { content: "Likely exam question"; display: block; font: 700 12px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
  .pending { color: var(--muted); font-style: italic; }
  .solo { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
  .solo .cap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .solo .cap b { font: 700 18px var(--display); }
  .progress { flex: 1; height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--blue); transition: width .2s; }
  .count { font: 700 14px var(--mono); min-width: 64px; text-align: center; }
  .nav { font-size: 18px; padding: 8px 16px; }
  .text table { font-size: .88em; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } .imgs { position: static; } .hide-sm { display: none; } }
</style>
</head>
<body>
  <header class="bar">
    <a class="home" href="index.html">← List</a>
    <div class="title" id="title"></div>
    <div class="seg" role="group" aria-label="Mode">
      <button id="mOnly">Slides only</button>
      <button id="mExplain">Explained</button>
    </div>
    <button class="iconbtn hide-sm" id="fsBtn">Fullscreen</button>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="foot">
    <button class="iconbtn nav" id="prev" aria-label="Previous">←</button>
    <div class="progress"><div id="prog"></div></div>
    <div class="count" id="count"></div>
    <button class="iconbtn nav" id="next" aria-label="Next">→</button>
  </footer>

<script src="econ-data.js"></script>
<script src="list.js"></script>
<script>
  const box = (k, h) => `<div class="box ${k}">${h}</div>`;
  let mode = "only", idx = 0;
  const stage = document.getElementById("stage");
  const total = () => (mode === "only" ? FLAT.length : LIST.length);

  function renderOnly() {
    const { q, s, i } = FLAT[idx];
    return `<div class="solo">
      <div class="cap"><b>${q.label} · Week ${q.week} · slide ${s}</b>
        <span class="kicker">${q.slides.length > 1 ? `slide ${i + 1} of ${q.slides.length} for this question` : ""}${q.calc ? " · CALCULATION" : ""}</span></div>
      ${q.note ? box("trap", q.note) : ""}
      <a href="${IMG(q.week, s)}" target="_blank" rel="noopener" title="Open full size"><img src="${IMG(q.week, s)}" alt="Week ${q.week} slide ${s}"></a>
    </div>`;
  }

  function renderExplain() {
    const q = LIST[idx], e = byId(q.id);
    const imgs = q.slides.map((s) => `<a href="${IMG(q.week, s)}" target="_blank" rel="noopener"><img src="${IMG(q.week, s)}" alt="Week ${q.week} slide ${s}" loading="lazy"><span>Week ${q.week} · slide ${s} ↗</span></a>`).join("");
    const text = e ? `
        <div><span class="pill ${q.calc ? "red" : "blue"}">${q.calc ? "calculation" : "theory"}</span> <span class="pill blue">${e.topic}</span></div>
        ${e.note ? box("trap", e.note) : q.note ? box("trap", q.note) : ""}
        ${box("simple", e.explain)}
        ${box("qbox", e.question)}
        <details class="ans"><summary>Show model answer</summary><div>${e.answer}</div></details>
        ${e.memorize && e.memorize.length ? box("why", `<ul class="dots">${e.memorize.map((m) => `<li>${m}</li>`).join("")}</ul>`) : ""}`
      : `${q.note ? box("trap", q.note) : ""}<p class="pending">Explanation still being written. Refresh in a few minutes.</p>`;
    return `<article class="card">
      <div class="kicker">${idx + 1} / ${LIST.length} · <a href="${PDF(q.week)}" target="_blank" rel="noopener">Week ${q.week} PDF ↗</a></div>
      <h2>${q.label} · Week ${q.week} · slide${q.slides.length > 1 ? "s" : ""} ${q.slides.join(", ")}</h2>
      <div class="split"><div class="imgs">${imgs}</div><div class="text">${text}</div></div>
    </article>`;
  }

  function show(i) {
    idx = Math.max(0, Math.min(total() - 1, i));
    stage.innerHTML = mode === "only" ? renderOnly() : renderExplain();
    stage.scrollTop = 0;
    document.getElementById("title").textContent = mode === "only" ? "Econ midterm · the professor's slides" : "Econ midterm · explained";
    document.getElementById("count").textContent = `${idx + 1}/${total()}`;
    document.getElementById("prog").style.width = `${((idx + 1) / total()) * 100}%`;
    document.getElementById("mOnly").classList.toggle("on", mode === "only");
    document.getElementById("mExplain").classList.toggle("on", mode === "explain");
    history.replaceState(null, "", `#${mode}-${idx + 1}`);
  }

  function setMode(m) {
    if (m === mode) return;
    const qid = mode === "only" ? FLAT[idx].q.id : LIST[idx].id;
    mode = m;
    show(m === "only" ? FLAT.findIndex((f) => f.q.id === qid) : LIST.findIndex((q) => q.id === qid));
  }

  document.getElementById("mOnly").onclick = () => setMode("only");
  document.getElementById("mExplain").onclick = () => setMode("explain");
  document.getElementById("prev").onclick = () => show(idx - 1);
  document.getElementById("next").onclick = () => show(idx + 1);
  document.getElementById("fsBtn").onclick = () => {
    try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("summary")) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); show(idx + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); show(idx - 1); }
    else if (e.key.toLowerCase() === "e") setMode(mode === "only" ? "explain" : "only");
    else if (e.key.toLowerCase() === "f") document.getElementById("fsBtn").click();
  });
  let tx = null, ty = null;
  stage.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) show(idx + (dx < 0 ? 1 : -1));
    tx = null;
  });
  function fromHash() {
    const [m, n] = location.hash.slice(1).split("-");
    mode = m === "explain" ? "explain" : "only";
    show((parseInt(n, 10) || 1) - 1);
  }
  window.addEventListener("hashchange", () => { const [m, n] = location.hash.slice(1).split("-"); if (m !== mode || +n - 1 !== idx) fromHash(); });
  fromHash();
</script>
</body>
</html>
